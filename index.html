<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创图大师 CreateMaster · AI 图像生成</title>
<style>
  /* ========== Design System ========== */
  :root {
    --bg: #f2f4f8;
    --bg-card: #ffffff;
    --card-border: #e2e6ed;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(99,102,241,0.07);
    --card-shadow-hover: 0 4px 20px rgba(99,102,241,0.12);
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent-1: #6366f1;
    --accent-2: #818cf8;
    --accent-3: #06b6d4;
    --accent-gradient: linear-gradient(135deg, #6366f1, #818cf8, #06b6d4);
    --accent-soft: #eef2ff;
    --section-bg: #f8f9fc;
    --input-bg: #f8f9fc;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ========== Soft Background ========== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse 70% 50% at 0% 20%, rgba(99,102,241,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 60% at 100% 80%, rgba(6,182,212,0.03) 0%, transparent 60%),
      var(--bg);
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%236366f1' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.5;
  }

  /* ========== Scrollbar ========== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.15); border-radius: 4px; }

  /* ========== Layout ========== */
  .app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 24px;
    min-height: 100vh;
    align-content: start;
  }

  .main-area {
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow);
    padding: 28px;
    transition: box-shadow 0.3s, transform 0.2s;
  }

  .main-area:hover {
    box-shadow: var(--card-shadow-hover);
  }

  /* ========== Header ========== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: white;
    box-shadow: 0 0 20px rgba(99,102,241,0.3);
  }

  .header-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-title span {
    font-weight: 400;
    font-size: 14px;
    -webkit-text-fill-color: var(--text-secondary);
    color: var(--text-secondary);
  }

  .header-info {
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    line-height: 1.5;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    border: 1px solid rgba(99,102,241,0.1);
  }

  .header-info strong {
    color: var(--accent-3);
    font-weight: 600;
  }

  /* ========== Section Labels ========== */
  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    display: block;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .section-group {
    background: var(--section-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-group:last-child {
    margin-bottom: 0;
  }

  /* ========== Model Selector ========== */
  .model-grid {
    display: flex;
    gap: 10px;
  }

  .model-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }

  .model-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    background: var(--accent-gradient);
    transition: opacity 0.25s;
  }

  .model-btn:hover {
    border-color: rgba(99,102,241,0.3);
    transform: translateY(-1px);
    background: rgba(99,102,241,0.02);
  }

  .model-btn.active {
    border-color: var(--accent-1);
    background: var(--accent-soft);
    box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
  }

  .model-btn.active::before {
    opacity: 0.05;
  }

  .model-btn .model-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  .model-btn .model-cost {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }

  .model-btn.active .model-cost {
    color: var(--accent-3);
  }

  .model-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent-gradient);
    color: white;
    font-weight: 700;
    z-index: 1;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .model-btn.active .model-badge {
    opacity: 1;
  }

  /* ========== Aspect Ratio ========== */
  .ratio-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .ratio-btn {
    padding: 7px 14px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    color: var(--text-secondary);
    min-width: 48px;
    text-align: center;
    font-weight: 500;
  }

  .ratio-btn:hover {
    border-color: rgba(99,102,241,0.3);
    color: var(--text);
    background: rgba(99,102,241,0.02);
  }

  .ratio-btn.active {
    border-color: var(--accent-1);
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 600;
  }

  /* Resolution */
  .resolution-grid {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .resolution-btn {
    padding: 8px 24px;
    border: 1px solid var(--card-border);
    border-radius: 20px;
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .resolution-btn:hover {
    border-color: rgba(99,102,241,0.3);
    color: var(--text);
  }

  .resolution-btn.active {
    border-color: var(--accent-3);
    background: rgba(6,182,212,0.06);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 0 0 2px rgba(6,182,212,0.2);
  }

  /* ========== Prompt Input ========== */
  .prompt-area {
  }

  .prompt-area textarea {
    width: 100%;
    min-height: 100px;
    padding: 14px 16px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--input-bg);
    resize: vertical;
    transition: all 0.2s;
    outline: none;
    line-height: 1.7;
  }

  .prompt-area textarea:focus {
    border-color: rgba(99,102,241,0.4);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.08);
    background: rgba(99,102,241,0.02);
  }

  .prompt-area textarea::placeholder {
    color: var(--text-muted);
  }

  /* ========== Image Upload ========== */
  .upload-area {
  }

  .upload-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: 1.5px dashed var(--card-border);
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .upload-btn:hover {
    border-color: var(--accent-1);
    color: var(--accent-1);
    background: var(--input-bg);
  }

  .upload-preview {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .upload-preview-item {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--card-border);
  }

  .upload-preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .upload-preview-item .remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    background: rgba(0,0,0,0.6);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .upload-preview-item .remove-btn:hover {
    background: rgba(239,68,68,0.8);
  }

  /* ========== API Key Row ========== */
  .key-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .key-row .section-label { margin-bottom: 0; white-space: nowrap; }

  .key-input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    color: var(--text);
    background: var(--input-bg);
  }

  .key-input:focus {
    border-color: rgba(99,102,241,0.4);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
  }

  .key-input::placeholder {
    color: var(--text-muted);
    font-family: var(--font);
  }

  .btn {
    padding: 9px 16px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: var(--accent-soft);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: all 0.2s;
    white-space: nowrap;
    font-weight: 500;
  }

  .btn:hover {
    border-color: var(--accent-1);
    color: var(--accent-1);
    background: var(--accent-soft);
  }

  /* ========== Generate Button ========== */
  .generate-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 4px;
  }

  .btn-generate {
    flex: 1;
    padding: 16px 28px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    background: var(--accent-gradient);
    color: white;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    letter-spacing: 0.3px;
    position: relative;
    overflow: hidden;
  }

  .btn-generate::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-generate:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(99,102,241,0.35);
  }

  .btn-generate:hover:not(:disabled)::after {
    opacity: 1;
  }

  .btn-generate:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-generate:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-generate.generating {
    background: linear-gradient(135deg, #94a3b8, #cbd5e1);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* ========== Status Messages ========== */
  .status-msg {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-top: 14px;
    display: none;
    font-weight: 500;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .status-msg.error {
    display: block;
    background: #fef2f2;
    color: #dc2626;
    border: 1px solid #fecaca;
  }

  .status-msg.success {
    display: block;
    background: #f0fdf4;
    color: #16a34a;
    border: 1px solid #bbf7d0;
  }

  /* ========== Loading ========== */
  .loading-indicator {
    display: none;
    text-align: center;
    padding: 50px 0;
  }

  .loading-indicator .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid var(--card-border);
    border-top-color: var(--accent-1);
    border-right-color: var(--accent-3);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-indicator .status-text {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* ========== Result ========== */
  .result-area {
    margin-top: 16px;
  }

  .result-image-container {
    position: relative;
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--bg-card);
    display: none;
    border: 1px solid var(--card-border);
  }

  .result-image-container img {
    width: 100%;
    display: block;
  }

  .result-image-container .result-actions {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
  }

  .result-image-container .result-actions a {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 7px 16px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    color: white;
    border-radius: 6px;
    font-size: 12px;
    text-decoration: none;
    transition: background 0.2s;
    font-weight: 500;
  }

  .result-image-container .result-actions a:hover {
    background: rgba(0,0,0,0.8);
  }

  /* ========== History Panel ========== */
  .history-panel {
    background: var(--bg-card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--card-shadow);
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.3s;
  }

  .history-panel:hover {
    box-shadow: var(--card-shadow-hover);
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--card-border);
  }

  .history-header h3 {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
  }

  .history-header .clear-btn {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    background: none;
    border: 1px solid var(--card-border);
    padding: 5px 12px;
    border-radius: 6px;
    transition: all 0.2s;
    font-weight: 500;
  }

  .history-header .clear-btn:hover {
    border-color: rgba(239,68,68,0.3);
    color: var(--danger);
    background: rgba(239,68,68,0.05);
  }

  .history-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
  }

  .history-item {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    cursor: pointer;
    transition: all 0.2s;
    aspect-ratio: 1;
    background: var(--input-bg);
  }

  .history-item:hover {
    transform: scale(1.03);
    border-color: rgba(99,102,241,0.3);
    box-shadow: 0 4px 16px rgba(99,102,241,0.12);
  }

  .history-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .history-item .history-delete {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    background: rgba(0,0,0,0.5);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 2;
  }

  .history-item:hover .history-delete {
    opacity: 1;
  }

  .history-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  .history-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
    color: var(--text-muted);
  }

  .history-pagination button {
    padding: 5px 12px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: var(--input-bg);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    transition: all 0.2s;
    font-weight: 500;
  }

  .history-pagination button:hover:not(:disabled) {
    border-color: rgba(99,102,241,0.3);
    color: var(--text);
    background: rgba(99,102,241,0.02);
  }

  .history-pagination button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ========== Preview Modal ========== */
  .preview-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .preview-modal.show { display: flex; }

  .preview-modal .preview-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .preview-modal .preview-close:hover {
    background: rgba(255,255,255,0.15);
  }

  .preview-modal .preview-content {
    max-width: 90vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .preview-modal .preview-content img {
    max-width: 90vw;
    max-height: 75vh;
    border-radius: 12px;
    object-fit: contain;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .preview-modal .preview-nav {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .preview-modal .preview-nav button {
    padding: 9px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    font-weight: 500;
  }

  .preview-modal .preview-nav button:hover {
    background: rgba(255,255,255,0.15);
  }

  .preview-modal .preview-nav a {
    padding: 9px 20px;
    background: var(--accent-gradient);
    border-radius: 8px;
    color: white;
    text-decoration: none;
    font-size: 13px;

<script>
// ============= Configuration =============
const API_GENERATE = 'https://grsai.dakka.com.cn/v1/api/generate';
const API_RESULT = 'https://grsai.dakka.com.cn/v1/api/result';

const STORAGE_KEY_KEY = 'nanobanana_api_key';
const STORAGE_KEY_HISTORY = 'nanobanana_history';

// ============= 4K Size Calculation =============
function compute4KSize(ratioStr) {
  if (!ratioStr || typeof ratioStr !== 'string' || !ratioStr.includes(':')) return '3840x3840';
  const parts = ratioStr.split(':');
  const a = parseFloat(parts[0]);
  const b = parseFloat(parts[1]);
  if (!(a > 0) || !(b > 0)) return '3840x3840';

  const MAX_EDGE = 3840;
  const STEP = 16;
  const MAX_RATIO = 3;
  const MIN_PIXELS = 655360;
  const MAX_PIXELS = 8294400;

  const landscape = a >= b;
  const lr = Math.max(a, b);
  const sr = Math.min(a, b);
  const r = Math.min(lr / sr, MAX_RATIO);

  let longE = Math.min(MAX_EDGE, Math.floor(Math.sqrt(MAX_PIXELS * r)));
  let shortE = longE / r;
  longE = Math.floor(longE / STEP) * STEP;
  shortE = Math.floor(shortE / STEP) * STEP;
  if (longE < STEP) longE = STEP;
  if (shortE < STEP) shortE = STEP;

  let maxIter = 50;
  while (longE * shortE < MIN_PIXELS && maxIter-- > 0) {
    let bumped = false;
    if (longE + STEP <= MAX_EDGE && (longE + STEP) * shortE <= MAX_PIXELS) { longE += STEP; bumped = true; }
    else if (shortE + STEP <= longE && longE * (shortE + STEP) <= MAX_PIXELS) { shortE += STEP; bumped = true; }
    if (!bumped) break;
  }

  maxIter = 50;
  while (longE * shortE > MAX_PIXELS && maxIter-- > 0) {
    if (longE >= shortE) longE -= STEP; else shortE -= STEP;
    if (longE < STEP || shortE < STEP) break;
  }

  maxIter = 50;
  while (longE / shortE > MAX_RATIO && maxIter-- > 0) {
    longE -= STEP;
    if (longE < STEP) break;
  }

  const W = landscape ? longE : shortE;
  const H = landscape ? shortE : longE;
  return `${W}x${H}`;
}

// ============= State =============
let state = {
  model: 'nano-banana-pro',
  aspectRatio: '1:1',
  imageSize: '4K',
  prompt: '',
  images: [],
  imageBase64List: [],
  apiKey: localStorage.getItem(STORAGE_KEY_KEY) || 'sk-c5addffcab314df497c59bd3b7cd459a',
  history: JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || '[]'),
  currentPage: 1,
  pageSize: 12,
  isGenerating: false,
  previewIndex: -1,
};

// ============= DOM Refs =============
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const modelGrid = $('#modelGrid');
const ratioGrid = $('#ratioGrid');
const resolutionGrid = $('#resolutionGrid');
const promptInput = $('#promptInput');
const apiKeyInput = $('#apiKeyInput');
const imageUpload = $('#imageUpload');
const uploadPreview = $('#uploadPreview');
const generateBtn = $('#generateBtn');
const errorMsg = $('#errorMsg');
const successMsg = $('#successMsg');
const loadingIndicator = $('#loadingIndicator');
const loadingText = $('#loadingText');
const resultContainer = $('#resultContainer');
const resultImage = $('#resultImage');
const downloadBtn = $('#downloadBtn');
const openBtn = $('#openBtn');
const historyGrid = $('#historyGrid');
const pageInfo = $('#pageInfo');
const prevPageBtn = $('#prevPageBtn');
const nextPageBtn = $('#nextPageBtn');
const clearHistoryBtn = $('#clearHistoryBtn');
const previewModal = $('#previewModal');
const previewImage = $('#previewImage');
const previewClose = $('#previewClose');
const prevImageBtn = $('#prevImageBtn');
const nextImageBtn = $('#nextImageBtn');
const downloadPreviewBtn = $('#downloadPreviewBtn');
const saveKeyBtn = $('#saveKeyBtn');
const queryBalanceBtn = $('#queryBalanceBtn');
const pixelInfo = $('#pixelInfo');

// ============= Init =============
apiKeyInput.value = state.apiKey;
updatePixelInfo();
updateResolutionLock();

// ============= Pixel Info Update =============
function updatePixelInfo() {
  const isGptVip = state.model === 'gpt-image-2-vip';
  if (isGptVip) {
    const pixelDim = compute4KSize(state.aspectRatio);
    pixelInfo.textContent = `→ 4K 像素尺寸：${pixelDim}（最长边 ≤ 3840px）`;
    pixelInfo.style.display = 'block';
  } else {
    pixelInfo.style.display = 'none';
  }
}

// ============= Resolution Auto-Lock =============
function updateResolutionLock() {}

// ============= Model Selection =============
modelGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.model-btn');
  if (!btn) return;
  modelGrid.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.model = btn.dataset.model;
  updatePixelInfo();
  updateResolutionLock();
});

// ============= Aspect Ratio =============
ratioGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.ratio-btn');
  if (!btn) return;
  ratioGrid.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.aspectRatio = btn.dataset.ratio;
  updatePixelInfo();
});

// ============= Resolution =============
resolutionGrid.addEventListener('click', (e) => {
  const btn = e.target.closest('.resolution-btn');
  if (!btn) return;
  resolutionGrid.querySelectorAll('.resolution-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.imageSize = btn.dataset.size;
  updatePixelInfo();
});

// ============= Prompt =============
promptInput.addEventListener('input', () => {
  state.prompt = promptInput.value;
});

// ============= Image Upload =============
imageUpload.addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;

  for (const file of files) {
    if (state.images.length >= 4) {
      showError('最多上传4张参考图片');
      break;
    }
    const base64 = await fileToBase64(file);
    state.images.push({ file, url: URL.createObjectURL(file), base64 });
    state.imageBase64List.push(base64);
  }

  renderUploadPreview();
  imageUpload.value = '';
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderUploadPreview() {
  uploadPreview.innerHTML = state.images.map((img, i) =>
    `<div class="upload-preview-item">
      <img src="${img.url}" alt="ref${i}">
      <button class="remove-btn" data-index="${i}">✕</button>
    </div>`
  ).join('');
}

uploadPreview.addEventListener('click', (e) => {
  const btn = e.target.closest('.remove-btn');
  if (!btn) return;
  const idx = parseInt(btn.dataset.index);
  URL.revokeObjectURL(state.images[idx].url);
  state.images.splice(idx, 1);
  state.imageBase64List.splice(idx, 1);
  renderUploadPreview();
});

// ============= API Key =============
saveKeyBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (!key) {
    showError('请输入 API Key');
    return;
  }
  state.apiKey = key;
  localStorage.setItem(STORAGE_KEY_KEY, key);
  hideError();
  showSuccess('API Key 已保存');
  setTimeout(() => hideSuccess(), 2000);
});

queryBalanceBtn.addEventListener('click', async () => {
  const key = apiKeyInput.value.trim() || state.apiKey;
  if (!key) { showError('请先输入 API Key'); return; }

  const activeBtn = modelGrid.querySelector('.model-btn.active');
  const displayCost = parseInt(activeBtn?.dataset?.cost || '280');

  queryBalanceBtn.disabled = true;
  queryBalanceBtn.textContent = '查询中...';
  hideError(); hideSuccess();

  try {
    const resp = await fetch('https://grsai.dakka.com.cn/client/openapi/getAPIKeyCredits', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: key })
    });
    const data = await resp.json();

    if (data.code === 0 && data.data && typeof data.data.credits === 'number') {
      const relayCredits = data.data.credits;
      const displayBalance = relayCredits / 10;
      const remainingAfterUse = Math.floor(displayBalance - displayCost);

      if (displayBalance < displayCost) {
        showError(`积分不足！当前 ${Math.floor(displayBalance)} 分，需要 ${displayCost} 分，请联系作者充值`);
      } else {
        showSuccess(`剩余积分: ${Math.max(0, remainingAfterUse)}`);
      }
    } else {
      showError('查询失败: ' + (data.msg || '未知错误'));
    }
  } catch (err) {
    showError('查询失败: ' + err.message);
  } finally {
    queryBalanceBtn.disabled = false;
    queryBalanceBtn.textContent = '🔍 查询剩余';
    setTimeout(() => { hideError(); hideSuccess(); }, 6000);
  }
});

// ============= Generate =============
generateBtn.addEventListener('click', generateImage);

async function generateImage() {
  if (state.isGenerating) return;

  const key = apiKeyInput.value.trim() || state.apiKey;
  if (!key) { showError('请先输入 API Key'); return; }
  if (!state.prompt.trim()) { showError('请输入创意描述'); return; }

  state.apiKey = key;
  localStorage.setItem(STORAGE_KEY_KEY, key);

  const activeModelBtn = modelGrid.querySelector('.model-btn.active');
  const displayCost = parseInt(activeModelBtn?.dataset?.cost || '280');

  loadingText.textContent = '正在检查积分余额...';
  try {
    const creditResp = await fetch('https://grsai.dakka.com.cn/client/openapi/getAPIKeyCredits', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: key })
    });
    const creditData = await creditResp.json();
    if (creditData.code === 0 && creditData.data && typeof creditData.data.credits === 'number') {
      const relayBalance = creditData.data.credits;
      const displayBalance = relayBalance / 10;
      if (displayBalance < displayCost) {
        showError(`积分余额不足，请联系作者充值（当前 ${Math.floor(displayBalance)} 分，需要 ${displayCost} 分）`);
        state.isGenerating = false;
        generateBtn.disabled = false;
        generateBtn.textContent = '✨ 开始生成';
        generateBtn.classList.remove('generating');
        loadingIndicator.style.display = 'none';
        return;
      }
    }
  } catch (e) {
    console.warn('积分查询失败:', e.message);
  }

  state.isGenerating = true;
  generateBtn.disabled = true;
  generateBtn.textContent = '⏳ 生成中...';
  generateBtn.classList.add('generating');
  hideError(); hideSuccess();
  resultContainer.style.display = 'none';
  loadingIndicator.style.display = 'block';
  loadingText.textContent = '正在提交任务...';

  const isGptVip = state.model === 'gpt-image-2-vip';
  const payload = { model: state.model, prompt: state.prompt, replyType: 'json' };

  if (isGptVip) {
    const pixelDim = compute4KSize(state.aspectRatio);
    payload.aspectRatio = pixelDim;
  } else {
    payload.aspectRatio = state.aspectRatio;
    payload.imageSize = state.imageSize;
  }

  if (state.imageBase64List.length > 0) {
    payload.images = state.imageBase64List;
  }

  try {
    loadingText.textContent = '正在生成中，请稍候...';
    const resp = await fetch(API_GENERATE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

    if (data.status === 'succeeded' && data.results && data.results.length > 0) {
      const imageUrl = data.results[0].url;
      showResult(imageUrl);
      addToHistory(imageUrl);
    } else if (data.status === 'running' || data.status === 'queued') {
      await pollResult(data.id, key);
    } else if (data.status === 'violation') {
      showError('内容违规，请修改提示词后重试');
    } else if (data.status === 'failed') {
      showError(data.error || '生成失败');
    } else {
      showError('未知状态：' + (data.status || '无响应'));
    }
  } catch (err) {
    showError('生成失败：' + err.message);
  } finally {
    state.isGenerating = false;
    generateBtn.disabled = false;
    generateBtn.textContent = '✨ 开始生成';
    generateBtn.classList.remove('generating');
    loadingIndicator.style.display = 'none';
  }
}

async function pollResult(taskId, key) {
  const maxAttempts = 60;
  const interval = 3000;
  let attempts = 0;
  loadingText.textContent = '任务已提交，正在等待生成结果...';

  while (attempts < maxAttempts) {
    await sleep(interval);
    attempts++;
    loadingText.textContent = `正在生成中... (${attempts * 3}s)`;

    try {
      const resp = await fetch(`${API_RESULT}?id=${encodeURIComponent(taskId)}`, {
        headers: { 'Authorization': `Bearer ${key}` }
      });
      const data = await resp.json();

      if (data.status === 'succeeded' && data.results && data.results.length > 0) {
        const imageUrl = data.results[0].url;
        showResult(imageUrl);
        addToHistory(imageUrl);
        return;
      } else if (data.status === 'violation') {
        showError('内容违规，请修改提示词后重试');
        return;
      } else if (data.status === 'failed') {
        showError(data.error || '生成失败');
        return;
      }
    } catch (err) {
      console.warn('Poll attempt failed:', err.message);
    }
  }
  showError('生成超时，请稍后查看历史记录');
}

function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// ============= Display Result =============
function showResult(url) {
  if (!url.startsWith('http')) url = 'https:' + url;
  resultImage.src = url;
  resultContainer.style.display = 'block';
  downloadBtn.href = url;
  openBtn.href = url;
  resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ============= History =============
function addToHistory(url) {
  state.history.unshift({
    url: url,
    prompt: state.prompt,
    model: state.model,
    time: new Date().toISOString()
  });
  if (state.history.length > 200) state.history = state.history.slice(0, 200);
  localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history));
  state.currentPage = 1;
  renderHistory();
}

function renderHistory() {
  const totalPages = Math.max(1, Math.ceil(state.history.length / state.pageSize));
  const page = Math.min(state.currentPage, totalPages);
  const start = (page - 1) * state.pageSize;
  const end = start + state.pageSize;
  const items = state.history.slice(start, end);

  if (state.history.length === 0) {
    historyGrid.innerHTML = '<div class="history-empty">暂无历史记录</div>';
    pageInfo.textContent = '第 0 页 / 共 0 页';
    prevPageBtn.disabled = true;
    nextPageBtn.disabled = true;
    return;
  }

  historyGrid.innerHTML = items.map((item, i) => {
    const idx = start + i;
    return `<div class="history-item" data-index="${idx}">
      <img src="${item.url}" loading="lazy" alt="">
      <button class="history-delete" data-index="${idx}">✕</button>
    </div>`;
  }).join('');

  pageInfo.textContent = `第 ${page} 页 / 共 ${totalPages} 页`;
  prevPageBtn.disabled = page <= 1;
  nextPageBtn.disabled = page >= totalPages;
}

historyGrid.addEventListener('click', (e) => {
  const item = e.target.closest('.history-item');
  const delBtn = e.target.closest('.history-delete');
  if (delBtn) {
    e.stopPropagation();
    const idx = parseInt(delBtn.dataset.index);
    state.history.splice(idx, 1);
    localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(state.history));
    renderHistory();
    return;
  }
  if (!item) return;
  const idx = parseInt(item.dataset.index);
  openPreview(idx);
});

prevPageBtn.addEventListener('click', () => {
  if (state.currentPage > 1) { state.currentPage--; renderHistory(); }
});

nextPageBtn.addEventListener('click', () => {
  const totalPages = Math.ceil(state.history.length / state.pageSize);
  if (state.currentPage < totalPages) { state.currentPage++; renderHistory(); }
});

clearHistoryBtn.addEventListener('click', () => {
  if (state.history.length === 0) return;
  if (confirm('确定要清空所有历史记录吗？')) {
    state.history = [];
    localStorage.setItem(STORAGE_KEY_HISTORY, '[]');
    state.currentPage = 1;
    renderHistory();
  }
});

// ============= Preview Modal =============
function openPreview(index) {
  state.previewIndex = index;
  updatePreview();
  previewModal.classList.add('show');
}

function updatePreview() {
  const item = state.history[state.previewIndex];
  if (!item) return;
  previewImage.src = item.url;
  downloadPreviewBtn.href = item.url;
  prevImageBtn.style.visibility = state.previewIndex > 0 ? 'visible' : 'hidden';
  nextImageBtn.style.visibility = state.previewIndex < state.history.length - 1 ? 'visible' : 'hidden';
}

prevImageBtn.addEventListener('click', () => {
  if (state.previewIndex > 0) { state.previewIndex--; updatePreview(); }
});

nextImageBtn.addEventListener('click', () => {
  if (state.previewIndex < state.history.length - 1) { state.previewIndex++; updatePreview(); }
});

document.addEventListener('keydown', (e) => {
  if (!previewModal.classList.contains('show')) return;
  if (e.key === 'Escape') { previewModal.classList.remove('show'); }
  else if (e.key === 'ArrowLeft') { prevImageBtn.click(); }
  else if (e.key === 'ArrowRight') { nextImageBtn.click(); }
});

previewClose.addEventListener('click', () => { previewModal.classList.remove('show'); });
previewModal.addEventListener('click', (e) => {
  if (e.target === previewModal) previewModal.classList.remove('show');
});

// ============= Status Helpers =============
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  successMsg.style.display = 'none';
}

function hideError() { errorMsg.style.display = 'none'; }

function showSuccess(msg) {
  successMsg.textContent = msg;
  successMsg.style.display = 'block';
  errorMsg.style.display = 'none';
}

function hideSuccess() { successMsg.style.display = 'none'; }

// ============= Init History =============
renderHistory();
</script>
</body>
</html>
